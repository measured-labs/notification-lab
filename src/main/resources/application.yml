spring:
  application:
    name: notification-lab
  # 기본값을 두지 않는다 — 로컬 5432의 다른 DB에 실수로 붙지 않게. 테스트는 Testcontainers가 채운다
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8106
